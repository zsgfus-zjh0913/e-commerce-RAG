<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商 RAG 知识库系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
    <!-- 侧边栏 -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">🛍️</span>
                <span class="logo-text">电商知识库</span>
            </div>
        </div>

        <!-- AI 模型设置 -->
        <div class="settings-section">
            <h3 class="section-title">AI 模型设置</h3>
            <div class="settings-row">
                <span class="settings-label">模型</span>
                <span class="settings-value">DeepSeek-V4-Pro</span>
            </div>
            <div id="llm-status" class="llm-status disconnected">
                <span class="llm-dot"></span>
                <span class="llm-text">未连接</span>
            </div>
            <div class="api-key-input">
                <input type="password" id="api-key-input" class="key-input"
                       placeholder="输入 DeepSeek API Key..." autocomplete="off">
                <button id="save-key-btn" class="save-key-btn">保存</button>
            </div>
            <p class="settings-hint">
                <a href="https://platform.deepseek.com/api_keys" target="_blank">获取 API Key</a>
                 · 设置后启用 AI 回答
            </p>
        </div>

        <!-- 上传区域 -->
        <div class="upload-section">
            <h3 class="section-title">上传文档</h3>
            <div id="dropzone" class="dropzone">
                <div class="dropzone-content">
                    <span class="upload-icon">📤</span>
                    <p>拖拽文件到此处</p>
                    <p class="dropzone-hint">或点击选择文件</p>
                    <p class="dropzone-formats">支持 .txt .md .csv .json .docx</p>
                </div>
                <input type="file" id="file-input" multiple accept=".txt,.md,.csv,.json,.docx" hidden>
            </div>
            <div id="upload-status" class="upload-status"></div>
        </div>

        <!-- 文档列表 -->
        <div class="doc-section">
            <div class="section-header">
                <h3 class="section-title">知识库文档</h3>
                <span id="doc-count" class="doc-count">0</span>
            </div>
            <div id="doc-list" class="doc-list">
                <div class="doc-empty">暂无文档</div>
            </div>
        </div>

        <!-- 统计 -->
        <div class="sidebar-footer">
            <div id="stats" class="stats">
                <span class="stat-item">文档：<b id="stat-docs">0</b></span>
                <span class="stat-item">文本块：<b id="stat-chunks">0</b></span>
            </div>
        </div>
    </aside>

    <!-- 主聊天区 -->
    <main id="main">
        <header class="chat-header">
            <h1>电商智能问答系统</h1>
            <p class="chat-subtitle">基于知识库的商品信息、尺码、FAQ 智能检索</p>
        </header>

        <div id="chat-messages" class="chat-messages">
            <!-- 欢迎消息 -->
            <div class="message bot-message">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-text">
                        您好！我是电商智能问答助手。您可以问我关于<strong>商品信息</strong>、<strong>尺码规格</strong>、<strong>退换货政策</strong>等问题。
                        <br><br>
                        <span class="example-hint">试试以下问题：</span>
                    </div>
                    <div class="example-questions">
                        <button class="example-q" onclick="askExample('有哪些商品？')">有哪些商品？</button>
                        <button class="example-q" onclick="askExample('服装尺码表是怎样的？')">服装尺码表</button>
                        <button class="example-q" onclick="askExample('退换货政策是什么？')">退换货政策</button>
                        <button class="example-q" onclick="askExample('蓝牙耳机的参数？')">蓝牙耳机参数</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="chat-input" class="chat-input"
                       placeholder="输入您的问题..." autocomplete="off">
                <button id="send-btn" class="send-btn" onclick="sendMessage()">
                    <span>发送</span>
                    <span class="send-icon">➤</span>
                </button>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
